[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "youtube-browsing-api"
dynamic = ["version"]
description = "Browsing only (no video download) simple youtube API"
readme = "README.md"
requires-python = ">=3.9"

license = { name = "MIT", file = "LICENSE" }

authors = [ { name = "Plushka" } ]

keywords = [
    "youtube",
    "api",
    "youtube-api"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

dependencies = [
    "requests>=2.32.5"
]

[project.optional-dependencies]
dev = ["uv"]

[project.urls]
Homepage = "https://github.com/PlushkaNet/youtube-browsing-api"
Repository = "https://github.com/PlushkaNet/youtube-browsing-api.git"

[tool.hatch.version]
path = "youtube_browsing_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["youtube_browsing_api"]